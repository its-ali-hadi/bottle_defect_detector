[project]
name = "python-detoctor"
version = "0.1.0"
description = "AI-assisted white bottle defect detector for conveyor camera feeds."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "opencv-python>=4.10.0",
  "openpyxl>=3.1.5",
  "Pillow>=10.0.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
bottle-detector = "bottle_detector.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
